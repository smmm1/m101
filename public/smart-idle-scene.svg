 <path d="M28 260v68h35v-68z" fill="#a66c55"/><path d="M70 235v93h34v-93z" fill="#5d6d68"/><path d="M110 255v73h32v-73z" fill="#b98b5d"/><path d="M148 225v103h40V225z" fill="#69566b"/><path d="M194 265v63h33v-63z" fill="#53616c"/><path d="M232 240v88h34v-88z" fill="#a15f4c"/><path d="M273 230v98h40v-98z" fill="#64715e"/><path d="M320 266v62h32v-62z" fill="#c28d58"/>
</g>
