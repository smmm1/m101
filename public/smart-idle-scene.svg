<g fill="#71875b" stroke="#405e45" stroke-width="4"><ellipse cx="1487" cy="475" rx="42" ry="18" transform="rotate(40 1487 475)"/><ellipse cx="1580" cy="500" rx="45" ry="18" transform="rotate(-30 1580 500)"/><ellipse cx="1415" cy="530" rx="40" ry="18" transform="rotate(20 1415 530)"/></g>
<!-- foreground chair -->
<path d="M360 900Q350 790 450 780H650Q760 800 745 900" fill="#51444a" stroke="#342e36" stroke-width="18"/>
<path d="M420 900Q420 830 470 825H620Q680 835 680 900" fill="#6e5960"/>
<!-- tiny stars and hand-drawn accents -->
<g fill="none" stroke="#ffe6bd" stroke-width="4" opacity=".7"><path d="M800 150l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/><path d="M1370 220l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/></g>
</svg>