<ellipse cx="260" cy="730" rx="175" ry="95" fill="#d9a77e" stroke="#8c5e49" stroke-width="8"/>
<ellipse cx="245" cy="700" rx="125" ry="78" fill="#f0c28e" stroke="#9b674c" stroke-width="7"/>
