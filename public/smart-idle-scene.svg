<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Cozy sunset workspace</title><desc id="desc">Hand-drawn cozy desk beside a window at sunset, with a sleeping cat, books, plants and a warm desk lamp.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#51466f"/><stop offset=".48" stop-color="#e77b72"/><stop offset="1" stop-color="#f7b36d"/></linearGradient>
 <linearGradient id="room" x2="0" y2="1"><stop stop-color="#59443f"/><stop offset="1" stop-color="#a56d4e"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#d99a62"/><stop offset="1" stop-color="#8c533b"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffcf8a" stop-opacity=".05"/><stop offset="1" stop-color="#553c62" stop-opacity=".3"/></linearGradient>
 <radialGradient id="lampGlow"><stop stop-color="#ffe7a7" stop-opacity=".8"/><stop offset="1" stop-color="#ffce83" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<!-- evening sky beyond the window -->
<rect width="1600" height="900" fill="#433b4b"/>
<rect x="470" y="40" width="1080" height="650" rx="8" fill="url(#sky)" stroke="#392e36" stroke-width="28"/>
<circle cx="1115" cy="405" r="72" fill="#ffe5a0"/>
<path d="M470 465 Q620 390 760 470 T1060 455 T1360 455 T1550 430 V690 H470Z" fill="#6e5361" opacity=".55"/>
