 <path d="M1210 540h140v150h-140z M1195 540l85-68 85 68z"/>
 <path d="M1380 560h150v130h-150z M1365 560l90-65 90 65z"/>
</g>
<g fill="#ffd08a" opacity=".8"><path d="M530 590h18v28h-18z M575 590h18v28h-18z M690 570h20v26h-20z M748 570h20v26h-20z M880 590h18v25h-18z M1040 580h22v28h-22z M1100 580h22v28h-22z M1250 575h20v27h-20z M1300 575h20v27h-20z M1420 590h22v28h-22z M1480 590h22v28h-22z"/></g>
