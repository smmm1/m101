<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">M101 terminal idle screen</title>
<desc id="desc">A dark developer terminal showing system status, User AFK / Away From Keyboard, and a blinking emerald cursor.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101719"/><stop offset="1" stop-color="#080d10"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#151f22"/><stop offset="1" stop-color="#101719"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8aa6a0" stroke-opacity=".045"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .muted{fill:#71817f}.white{fill:#dce8e4}.green{fill:#59e1a5}.cyan{fill:#65d9e8}.amber{fill:#d9b978}
    .cursor{animation:blink 1.05s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1320" cy="190" r="280" fill="#1c8067" opacity=".055"/>
<circle cx="270" cy="760" r="340" fill="#087f91" opacity=".045"/>
<!-- terminal window -->
<rect x="170" y="112" width="1260" height="676" rx="22" fill="#05090b" opacity=".5"/>
<rect x="160" y="100" width="1280" height="676" rx="18" fill="url(#panel)" stroke="#31413f" stroke-width="2"/>
<path d="M160 158H1440" stroke="#31413f" stroke-width="2"/>
<rect x="160" y="100" width="1280" height="58" rx="18" fill="#1b2729"/>
<path d="M160 140V158H1440V140" fill="#1b2729"/>
<circle cx="199" cy="129" r="7" fill="#e17b75"/><circle cx="225" cy="129" r="7" fill="#d8b66e"/><circle cx="251" cy="129" r="7" fill="#63c995"/>
<text x="800" y="136" text-anchor="middle" class="mono muted" font-size="17">M101 / SYSTEM MONITOR — IDLE SESSION</text>
<text x="208" y="213" class="mono green" font-size="18">m101@directory</text><text x="382" y="213" class="mono white" font-size="18">:</text><text x="397" y="213" class="mono cyan" font-size="18">~</text><text x="420" y="213" class="mono white" font-size="18">$ systemctl status user-session</text>
<text x="208" y="263" class="mono green" font-size="16">● user-session.service</text><text x="468" y="263" class="mono white" font-size="16"> - Interactive user session monitor</text>
<text x="208" y="300" class="mono muted" font-size="15">     Loaded: loaded (/etc/m101/session.service; enabled)</text>
<text x="208" y="334" class="mono muted" font-size="15">     Active: <tspan class="green">active (running)</tspan> · monitoring input events</text>
<text x="208" y="397" class="mono cyan" font-size="15">[ SYSTEM LOG ]</text>
<text x="208" y="438" class="mono muted" font-size="15">[15:42:08]</text><text x="326" y="438" class="mono green" font-size="15">INFO</text><text x="390" y="438" class="mono white" font-size="15"> Input monitor initialized</text>
<text x="208" y="473" class="mono muted" font-size="15">[15:42:09]</text><text x="326" y="473" class="mono green" font-size="15">INFO</text><text x="390" y="473" class="mono white" font-size="15"> No keyboard or pointer activity detected</text>
<text x="208" y="508" class="mono muted" font-size="15">[15:45:09]</text><text x="326" y="508" class="mono amber" font-size="15">WARN</text><text x="390" y="508" class="mono white" font-size="15"> Idle threshold reached · 180 seconds</text>
<path d="M208 552H1392" stroke="#31413f" stroke-width="1"/>
<rect x="208" y="588" width="8" height="8" rx="2" fill="#59e1a5" filter="url(#glow)"/>
<text x="237" y="598" class="mono green" font-size="17" letter-spacing="2">USER STATUS</text>
<text x="208" y="668" class="mono white" font-size="54" font-weight="700" letter-spacing="1">USER AFK</text>
<text x="210" y="706" class="mono cyan" font-size="21">Away From Keyboard</text>
<text x="208" y="746" class="mono muted" font-size="14">Session paused · Waiting for user activity</text>
<text x="208" y="836" class="mono muted" font-size="14">M101 DIRECTORY</text>
<text x="1392" y="836" text-anchor="end" class="mono muted" font-size="14">PRESS ANY KEY / MOVE POINTER TO RESUME</text>
<rect class="cursor" x="485" y="688" width="13" height="27" rx="1" fill="#59e1a5"/>
</svg>