<!doctype html>
<html lang="th" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mustang Directory - ระบบบริหารจัดการนิติบุคคล</title>
    <meta name="description" content="ระบบบริหารจัดการทะเบียนนิติบุคคล ทะเบียนกิจการ ตรวจสอบความถูกต้อง เชื่อมต่อฐานข้อมูล DBD และติดตามสถานะประจำปี" />
    <meta property="og:title" content="Mustang Directory - ระบบบริหารจัดการนิติบุคคล" />
    <meta property="og:description" content="ระบบบริหารจัดการทะเบียนนิติบุคคล ทะเบียนกิจการ ตรวจสอบความถูกต้อง เชื่อมต่อฐานข้อมูล DBD และติดตามสถานะประจำปี" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans (Modern Luxury), Sarabun (Readable Thai), JetBrains Mono (Codes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </head>
  <body class="h-full antialiased font-body bg-[#f8faf9] text-[#1e2925] selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root" class="h-full">
      <main id="startup-fallback" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8faf9;color:#334155;font-family:system-ui,sans-serif;text-align:center">
        <div><div style="font-size:14px;font-weight:600">กำลังเปิด M101 Directory…</div><div style="margin-top:8px;font-size:12px;color:#64748b">กำลังโหลดระบบ กรุณารอสักครู่</div></div>
      </main>
    </div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById('root');
          if (!root || root.hasAttribute('data-m101-app-mounted') || root.querySelector('[data-m101-app-mounted]')) return;
          root.innerHTML = '';
          const panel = document.createElement('main');
          panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8faf9;color:#334155;font-family:system-ui,sans-serif';
          const content = document.createElement('section');
          content.style.cssText = 'width:min(100%,520px);padding:28px;border:1px solid #e2e8f0;border-radius:20px;background:white;box-shadow:0 12px 40px rgba(15,23,42,.08)';
          const title = document.createElement('h1');
          title.textContent = 'M101 เปิดหน้าเว็บไม่สำเร็จ';
          title.style.cssText = 'margin:0;font-size:20px;font-weight:700';
          const detail = document.createElement('p');
          detail.textContent = message || 'ไฟล์ของหน้าเว็บโหลดไม่ครบหรือเกิดข้อผิดพลาดระหว่างเริ่มระบบ';
          detail.style.cssText = 'margin:12px 0 0;color:#b91c1c;font-size:13px;line-height:1.6;overflow-wrap:anywhere';
          const retry = document.createElement('button');
          retry.textContent = 'โหลดหน้าเว็บอีกครั้ง';
          retry.style.cssText = 'margin-top:20px;padding:10px 16px;border:0;border-radius:10px;background:#0f172a;color:white;font-weight:600;cursor:pointer';
          retry.onclick = () => location.reload();
          content.append(title, detail, retry);
          panel.append(content);
          root.append(panel);
        };
        window.addEventListener('error', (event) => {
          if (!document.querySelector('#root[data-m101-app-mounted], #root [data-m101-app-mounted]')) {
            showStartupError(event.message || 'เกิดข้อผิดพลาดในการโหลด JavaScript');
          }
        });
        window.addEventListener('unhandledrejection', (event) => {
          if (!document.querySelector('#root [data-m101-app-mounted]')) {
            const reason = event.reason;
            showStartupError(reason && reason.message ? reason.message : 'เกิดข้อผิดพลาดระหว่างเริ่มระบบ');
          }
        });
        window.setTimeout(() => {
          if (!document.querySelector('#root [data-m101-app-mounted]')) {
            showStartupError('ระบบไม่สามารถเริ่มทำงานได้ภายใน 12 วินาที โปรดลองโหลดใหม่ หากยังพบปัญหา ข้อความนี้ช่วยระบุตำแหน่งที่ผิดพลาดได้');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
