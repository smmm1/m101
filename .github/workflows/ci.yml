name: M101 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - product/m101-new-system-blueprint

permissions:
  contents: read

concurrency:
  group: m101-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/m101-npm-audit.json || true
          node -e "const a=require('/tmp/m101-npm-audit.json'); const v=Object.entries(a.vulnerabilities || {}).map(([name, item]) => ({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable})); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:v}, null, 2));"
      - name: Type-check
        run: npm run lint

      - name: Build for Cloudflare Pages
        run: npm run build
