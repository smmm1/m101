name: M101 CI

on:
  pull_request:
    branches:
      - main
      - feature/conflict-notification-recovery
  push:
    branches:
      - main
      - product/m101-new-system-blueprint
      - feature/m101-local-owner-auth

permissions:
  contents: read

concurrency:
  group: m101-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply m101_db --local

      - name: Verify legacy Owner migration and auth rate limiting
        run: python3 scripts/test-legacy-owner-migration.py

      - name: Dependency vulnerability audit
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=high
      - name: Type-check
        run: npm run lint

      - name: Build for Cloudflare Pages
        run: npm run build
